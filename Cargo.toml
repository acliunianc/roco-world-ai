[package]
name = "roco-world-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = "0.34.0"
dioxus = { version = "0.7.4", features = ["desktop"] }
enigo = "0.6.1"
image = "0.25.10"
ort = "2.0.0-rc.12"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
rig-core = "0.34.0"
scrap = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
surrealdb = "3.0.5"
tokio = { version = "1.50.0", features = ["full"] }
